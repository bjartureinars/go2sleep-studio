<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Go2Sleep Live</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#14171c;--mute:#6b7280;--line:#e3e6eb;--hr:#e5484d;--o2:#2f7de1;--aux:#8a5cf6;--pi:#17a673;--ok:#17a673;--warn:#d98a00}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#e8ebf0;--mute:#8b94a3;--line:#262c36;--hr:#ff6b70;--o2:#5aa2ff;--aux:#a98bff;--pi:#3ecf9a;--ok:#3ecf9a;--warn:#f0b13a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,system-ui,sans-serif;padding:16px;max-width:1100px;margin:auto}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:18px;margin:0;font-weight:650}
.pill{padding:3px 10px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:var(--card);color:var(--mute)}
.pill.live{color:var(--ok);border-color:var(--ok)}
.pill.wait{color:var(--warn);border-color:var(--warn)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.val{font-size:30px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.val small{font-size:13px;color:var(--mute);font-weight:500;margin-left:3px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:10px}
canvas{width:100%;height:130px;display:block}
pre{margin:0;max-height:220px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--mute)}
.note{color:var(--mute);font-size:13px;margin:10px 0}
</style>
</head>
<body>
<header>
  <h1>Go2Sleep live</h1>
  <span id="status" class="pill">connecting to bridge…</span>
  <span id="dev" class="pill" style="display:none"></span>
  <span id="ver" class="pill" style="display:none"></span>
</header>

<div class="grid">
  <div class="card"><div class="lbl">SpO₂</div><div class="val" id="spo2">–<small>%</small></div></div>
  <div class="card"><div class="lbl">Heart rate</div><div class="val" id="hr">–<small>bpm</small></div></div>
  <div class="card"><div class="lbl">Perfusion index</div><div class="val" id="pi">–</div></div>
  <div class="card"><div class="lbl">On finger</div><div class="val" id="wear">–</div></div>
  <div class="card"><div class="lbl">Battery</div><div class="val" id="bat">–<small>%</small></div></div>
  <div class="card"><div class="lbl">Aux signal (raw)</div><div class="val" id="aux">–</div></div>
</div>

<div class="note" id="note"></div>

<div class="charts">
  <div class="card"><div class="lbl">Heart rate</div><canvas id="c_hr"></canvas></div>
  <div class="card"><div class="lbl">SpO₂</div><canvas id="c_spo2"></canvas></div>
  <div class="card"><div class="lbl">Aux signal (unknown u16 in battery frame)</div><canvas id="c_aux"></canvas></div>
  <div class="card"><div class="lbl">Perfusion index</div><canvas id="c_pi"></canvas></div>
</div>

<div class="card" style="margin-top:10px"><div class="lbl">Raw frames</div><pre id="log"></pre></div>

<script>
const N=300, S={hr:[],spo2:[],aux:[],pi:[]}, COL={hr:'--hr',spo2:'--o2',aux:'--aux',pi:'--pi'};
const $=id=>document.getElementById(id), css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function push(k,v){S[k].push(v);if(S[k].length>N)S[k].shift()}
function draw(k,zeroOk){
  const cv=$('c_'+k),dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const d=S[k].filter(v=>v!=null&&(zeroOk||v>0));if(d.length<2){g.fillStyle=css('--mute');g.font='12px system-ui';g.fillText('waiting for data…',8,20);return}
  let lo=Math.min(...d),hi=Math.max(...d);if(hi-lo<4){const m=(hi+lo)/2;lo=m-2;hi=m+2}
  const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  g.strokeStyle=css('--line');g.lineWidth=1;g.fillStyle=css('--mute');g.font='11px system-ui';
  for(let i=0;i<=2;i++){const y=4+(h-8)*i/2;g.beginPath();g.moveTo(34,y);g.lineTo(w,y);g.stroke();g.fillText((hi-(hi-lo)*i/2).toFixed(hi-lo<10?1:0),0,y+4)}
  g.strokeStyle=css(COL[k]);g.lineWidth=2;g.beginPath();let first=true;
  S[k].forEach((v,i)=>{if(v==null||(!zeroOk&&v<=0)){first=true;return}const x=34+(w-34)*i/(N-1),y=4+(h-8)*(1-(v-lo)/(hi-lo));first?g.moveTo(x,y):g.lineTo(x,y);first=false});
  g.stroke();
}
function redraw(){draw('hr');draw('spo2');draw('aux',true);draw('pi',true)}
const log=[];function addLog(t){log.push(t);if(log.length>60)log.shift();$('log').textContent=log.join('\n');$('log').scrollTop=1e9}
function setStatus(s){const e=$('status');e.textContent=s.status||s;e.className='pill '+(s.status==='live'?'live':(s.status==='disconnected'||s==='bridge offline')?'':'wait')}
function connect(){
  const ws=new WebSocket('ws://localhost:8765');
  ws.onopen=()=>setStatus('bridge connected');
  ws.onclose=()=>{setStatus('bridge offline');setTimeout(connect,1500)};
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='status'){setStatus(m);if(m.name){$('dev').style.display='';$('dev').textContent=m.name}return}
    if(m.raw)addLog(new Date(m.t*1000).toLocaleTimeString()+'  '+m.raw.match(/../g).join(' '));
    if(m.type==='spo2'){
      $('spo2').firstChild.textContent=m.spo2||'–';$('hr').firstChild.textContent=m.hr||'–';$('pi').textContent=m.pi;
      $('wear').textContent=m.wearing?'Yes':'No';
      $('note').textContent=m.wearing?'':'Ring does not detect a finger — put it on (or hold it snugly) to get SpO₂ / heart rate.';
      push('hr',m.hr);push('spo2',m.spo2);push('pi',m.pi);
    }else if(m.type==='battery'){
      $('bat').firstChild.textContent=m.battery;
      if(m.aux!=null){$('aux').textContent=m.aux;push('aux',m.aux)}
    }else if(m.type==='version'){$('ver').style.display='';$('ver').textContent='fw '+m.version}
    redraw();
  };
}
connect();addEventListener('resize',redraw);
</script>
</body>
</html>
